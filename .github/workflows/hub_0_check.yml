name: "HUB - 0. Kiểm tra bản mới"
on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: npm run test:rules
      - uses: actions/upload-artifact@v4
        with:
          name: HUB-check-${{ github.sha }}
          path: |
            dist
            VERSION.json
            firebase.generated.json
          retention-days: 14
