name: "HUB - 1. Chạy Preview"
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hub-develop-preview
  cancel-in-progress: false
jobs:
  preview:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: npm run test:rules
      - uses: actions/upload-artifact@v4
        with:
          name: HUB-preview-${{ github.sha }}
          path: |
            dist
            VERSION.json
            firebase.generated.json
            firebase.test.generated.json
            rules/firestore.candidate.rules
          retention-days: 30
      - name: Kiểm tra cấu hình Firebase
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -z "$FIREBASE_TOKEN" ]; then
            echo "::error::Thiếu FIREBASE_TOKEN; chưa deploy Preview."
            exit 1
          fi
      - name: Deploy Hosting and Rules to HUB PTN TEST only
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          node scripts/deploy-test.mjs
      - name: Link bản test
        run: echo "HUB PTN TEST — https://hub-ptn-test.web.app" >> "$GITHUB_STEP_SUMMARY"
