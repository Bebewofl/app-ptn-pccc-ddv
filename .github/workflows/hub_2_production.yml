name: "HUB - 2. Xuất Production"

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Gõ chính xác: XUAT BAN"
        required: true
        type: string

permissions:
  contents: write

jobs:
  production:
    runs-on: ubuntu-latest
    steps:
      - name: Kiểm tra xác nhận
        run: |
          if [ "${{ inputs.confirm }}" != "XUAT BAN" ]; then
            echo "::error::Chưa xác nhận đúng. Production không thay đổi."
            exit 1
          fi

      - name: Lấy nguồn HUB đã test
        uses: actions/checkout@v4
        with:
          ref: hub-v225-oneclick
          fetch-depth: 0

      - name: Chuẩn bị Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Chụp mốc Production V2.1.1 trước khi nâng cấp
        run: node scripts/capture-v211.mjs

      - name: Lưu mốc V2.1.1 vào GitHub nếu chưa có
        run: |
          git config user.name "HFI HUB Release Bot"
          git config user.email "actions@github.com"
          git add baseline/v211 || true
          if ! git diff --cached --quiet; then
            git commit -m "Snapshot HUB V2.1.1 production baseline"
            git push origin HEAD:hub-v225-oneclick
          else
            echo "Baseline V2.1.1 đã có, không cần ghi lại."
          fi

      - name: Build đúng bản V2.2.5
        run: |
          node --check hub-v22.js
          node --check hub-v223-rndfix.js
          node --check hub-v224-chat.js
          node --check hub-v225-core.js
          node scripts/build-hub.mjs

      - name: Lưu gói Production để truy vết
        uses: actions/upload-artifact@v4
        with:
          name: HUB-V2.2.5-PRODUCTION-BUILD
          path: |
            dist
            firebase.generated.json
            VERSION.json
          retention-days: 90

      - name: Kiểm tra quyền Firebase
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -z "$FIREBASE_TOKEN" ]; then
            echo "::error::Chưa có FIREBASE_TOKEN. Production không thay đổi."
            exit 1
          fi

      - name: Cài Firebase CLI
        run: npm install -g firebase-tools

      - name: Xuất Hosting Production
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          firebase deploy --only hosting \
            --project app-ptn-pccc \
            --config firebase.generated.json \
            --token "$FIREBASE_TOKEN"

      - name: Hoàn tất
        run: |
          echo "HUB V2.2.5 đã lên Production. Firestore Rules không bị thay đổi bởi workflow này."
