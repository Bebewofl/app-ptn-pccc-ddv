<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#123a63">
<title>HUB-HFI · V3.0 LITE</title><link rel="icon" href="/assets/favicon-32.png"><link rel="stylesheet" href="/lite.css"></head>
<body><header><div class="brand"><img src="/assets/icon-128.png" alt="HFI"><div><strong>HUB-HFI</strong><small>Phiên bản V3.0 LITE · Tạo bởi Dương Đức Vượng</small></div></div><a id="portal" href="https://ptn-hfi-portal.firebaseapp.com/">← Menu Cổng HFI</a></header>
<div class="test-banner">MÔI TRƯỜNG KIỂM THỬ CÁCH LY · Chỉ dùng dữ liệu giả lập</div>
<main><section id="login"><h1>Đăng nhập HUB-HFI</h1><p>Chọn tài khoản thử nghiệm. Không dùng tài khoản thật.</p><label>Tài khoản<select id="demoAccount"><option value="director">Giám đốc</option><option value="ptn">Trưởng phòng PTN</option><option value="lead">Trưởng nhóm</option><option value="staff">Thử nghiệm viên</option><option value="pkt">Trưởng phòng Kỹ thuật</option><option value="qlcl">Trưởng phòng QLCL</option><option value="office">HCNS / Kho</option><option value="admin">Quản trị kỹ thuật</option></select></label><button id="signIn" class="primary">Đăng nhập thử nghiệm</button></section>
<p id="message" role="status" aria-live="polite"></p>
<section id="workspace" hidden><div class="account"><span id="identity"></span><button id="signOut">Đăng xuất</button></div><nav aria-label="Nghiệp vụ"><button data-page="overview">Tổng quan</button><button data-page="mine">Việc cần tôi xử lý</button><button data-page="all">Danh sách vấn đề</button><button data-page="history">Lịch sử và kết luận</button></nav>
<div class="pagehead"><h1 id="heading">Việc cần tôi xử lý</h1><button class="primary" id="report">+ Báo cáo vấn đề</button></div>
<div id="metrics"></div><div id="filters" hidden><label>Tìm kiếm<input id="search" type="search" placeholder="Mã, tiêu đề, YCTN, model"></label><label>Bộ phận báo cáo<select id="source"><option value="">Tất cả</option></select></label><label>Bộ phận chủ trì<select id="owner"><option value="">Tất cả</option></select></label><label>Người xử lý<select id="next"><option value="">Tất cả</option></select></label><label>Trạng thái<select id="status"><option value="">Tất cả</option></select></label><label>Mức độ<select id="severity"><option value="">Tất cả</option><option>Thông thường</option><option>Quan trọng</option><option>Khẩn cấp</option></select></label><label>Từ ngày<input id="dateFrom" type="date"></label><label>Đến ngày<input id="dateTo" type="date"></label></div>
<div id="list" aria-live="polite"></div></section></main>
<dialog id="modal"><div class="dialogHead"><h2 id="modalTitle"></h2><button id="closeModal" aria-label="Đóng">Đóng</button></div><div id="modalBody"></div></dialog>
<script src="/firebase-app-compat.js"></script><script src="/firebase-auth-compat.js"></script><script src="/firebase-firestore-compat.js"></script><script src="/lite.js"></script></body></html>
