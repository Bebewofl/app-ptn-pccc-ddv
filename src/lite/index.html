<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#183b5b">
<title>HUB-HFI · Phối hợp liên phòng ban</title><link rel="icon" href="/assets/favicon-32.png"><link rel="stylesheet" href="/lite.css"></head>
<body><header><div class="brand"><img src="/assets/icon-128.png" alt="HFI" width="42" height="42"><div><strong>HUB-HFI</strong><small>Phối hợp liên phòng ban</small></div></div><a id="portal" href="https://ptn-hfi-portal.firebaseapp.com/">Về Cổng HFI</a></header>
<main><div class="env" id="env">Đang kết nối…</div><p id="message" role="status" aria-live="polite"></p>
<section id="login" hidden><h1>Đăng nhập HUB-HFI</h1><div id="methods"></div></section>
<section id="workspace" hidden><div class="account"><span id="identity"></span><div><button id="notices">Thông báo</button> <button id="admin" hidden>Quản trị tài khoản</button> <button id="signOut">Đăng xuất</button></div></div>
<nav aria-label="Nghiệp vụ"><button data-page="mine">Việc cần tôi xử lý</button><button data-page="overview">Tổng quan</button><button data-page="all">Danh sách vấn đề</button><button data-page="history">Lịch sử và kết luận</button></nav>
<div class="pagehead"><h1 id="heading">Việc cần tôi xử lý</h1><button id="report" class="primary">+ Báo cáo vấn đề</button></div>
<div id="metrics"></div><div id="filters" hidden><label>Tìm kiếm<input id="search" type="search" placeholder="Mã, tiêu đề, phòng ban, người phụ trách…"></label><label>Trạng thái<select id="status"></select></label><label>Mức độ<select id="severity"></select></label></div>
<div id="list" aria-live="polite"></div></section></main>
<dialog id="modal"><div class="dialogHead"><h2 id="modalTitle"></h2><button id="closeModal" aria-label="Đóng cửa sổ">Đóng</button></div><p id="modalMsg" class="message" role="status"></p><div id="modalBody"></div></dialog>
<script src="/firebase-app-compat.js"></script><script src="/firebase-auth-compat.js"></script><script type="module" src="/lite.js"></script></body></html>
